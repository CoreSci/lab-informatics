# Runs the pytest suites of both data decoders on every supported Python version,
# and builds the mzML requirements traceability matrix from the JUnit results.
# Actions are pinned to full commit SHAs (tag in the comment); the token is read-only;
# no secrets are used. Test dependencies are pinned in .github/requirements-ci.txt.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned test dependencies
        run: |
          python -m pip install --only-binary=:all: -r .github/requirements-ci.txt

      - name: JCAMP-DX reader tests
        working-directory: data-decoders/jcamp-dx-reader
        run: python -m pytest -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/junit/jcamp-dx-${{ matrix.python-version }}.xml"

      - name: mzML tools tests
        if: ${{ !cancelled() }}
        working-directory: data-decoders/mzml-reader
        run: python -m pytest -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/junit/mzml-${{ matrix.python-version }}.xml"

      - name: Traceability matrix (mzML tools)
        if: ${{ !cancelled() }}
        working-directory: data-decoders/mzml-reader
        run: >-
          python traceability/build_matrix.py
          "$RUNNER_TEMP/junit/mzml-${{ matrix.python-version }}.xml"
          --out "$RUNNER_TEMP/junit/traceability-mzml-${{ matrix.python-version }}.md"

      - name: Upload JUnit reports and traceability matrix
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: warn
          retention-days: 14
